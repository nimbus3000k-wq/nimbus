<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nimbus — Breakout from Burnout</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --or:#f5a96a;--orl:#fcd5b0;--orp:#feecd8;--ord:#e8874a;
  --orb:linear-gradient(135deg,#f5b87a,#e8874a);
  --lav:#d8d0f8;--lavd:#8878d0;--lavm:#baaff0;
  --mint:#58b088;--sky:#5898d8;--pink:#c785a9;
  --td:#3a2818;--tm:#8a6848;--tl:#c0a888;
  --cb:rgba(255,252,248,0.85);--cbr:rgba(240,200,170,0.35);
  --rsm:12px;--rmd:18px;--rlg:24px;--rxl:32px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(150deg,#feecd8 0%,#fde8f0 30%,#ece8fc 60%,#d8f0e8 100%);min-height:100vh;color:var(--td);overflow-x:hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;width:100%;max-width:100%;}
.screen.active{display:flex;}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:3px;outline:none;background:linear-gradient(90deg,var(--or) var(--pct,50%),var(--orp) var(--pct,50%));}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:white;border:3px solid var(--or);cursor:pointer;box-shadow:0 2px 8px rgba(232,135,74,.3);}
.sr{display:flex;align-items:center;gap:12px;}.st{flex:1;}
.sv{font-size:16px;font-weight:900;color:var(--ord);min-width:26px;text-align:right;}
.bp{width:100%;padding:16px;border-radius:var(--rlg);border:none;background:var(--orb);color:white;font-family:'Nunito',sans-serif;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px;box-shadow:0 4px 16px rgba(232,135,74,.32);transition:all .2s;}
.bp:hover{transform:translateY(-1px);}
.bs{width:100%;padding:14px;border-radius:var(--rlg);border:1.5px solid rgba(240,190,150,.4);background:transparent;color:var(--tm);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;}
.fg{margin-bottom:16px;width:100%;}
.fl{font-size:12px;font-weight:800;color:var(--tl);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;display:block;}
.fi{width:100%;padding:13px 16px;border-radius:var(--rmd);border:1.5px solid rgba(240,200,160,.4);background:rgba(255,255,255,.9);font-family:'Nunito',sans-serif;font-size:15px;color:var(--td);outline:none;transition:border-color .2s;font-weight:600;}
.fi:focus{border-color:var(--or);}
.og{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.ob{padding:12px 10px;border-radius:var(--rmd);border:1.5px solid rgba(240,200,160,.35);background:rgba(255,255,255,.65);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--tm);cursor:pointer;transition:all .2s;text-align:center;}
.ob:hover{border-color:var(--or);color:var(--ord);}
.ob.sel{border-color:var(--or);background:rgba(245,169,106,.12);color:var(--ord);}
.tg{display:flex;flex-wrap:wrap;gap:8px;}
.si{display:flex;gap:8px;justify-content:center;margin-bottom:22px;}
.sd{width:8px;height:8px;border-radius:50%;background:var(--orl);transition:all .3s;}
.sd.act{background:var(--or);width:24px;border-radius:4px;}
.sd.dn{background:var(--mint);}

/* ORIGINAL LOGO DRAWING CLASS */
.logo-cloud { position: relative; width: 120px; height: 70px; margin: 0 auto; }
.lc-base { position: absolute; bottom: 0; width: 120px; height: 35px; background: #fff; border-radius: 20px; border: 4px solid var(--td); }
.lc-circle-1 { position: absolute; bottom: 10px; left: 15px; width: 45px; height: 45px; background: #fff; border-radius: 50%; border: 4px solid var(--td); border-bottom: none; border-right: none; }
.lc-circle-2 { position: absolute; bottom: 15px; left: 45px; width: 55px; height: 55px; background: #fff; border-radius: 50%; border: 4px solid var(--td); border-bottom: none; border-left: none; border-right: none; }

/* AUTH SCREEN */
#auth{align-items:center;justify-content:center;padding:24px;background:linear-gradient(150deg,#feecd8 0%,#fde8f0 40%,#ece8fc 100%);}
.ac{background:rgba(255,252,248,.92);backdrop-filter:blur(16px);border:1.5px solid rgba(240,200,160,.4);border-radius:var(--rxl);padding:32px 26px;max-width:400px;width:100%;box-shadow:0 12px 48px rgba(232,135,74,.12);}
.alo{text-align:center;margin-bottom:20px;}
.at{font-size:24px;font-weight:900;color:var(--td);margin-bottom:6px;text-align:center;}
.asb{font-size:14px;color:var(--tm);font-weight:600;text-align:center;margin-bottom:22px;}
.asw{font-size:13px;color:var(--tm);text-align:center;margin-top:14px;font-weight:700;}
.asw span{color:var(--ord);cursor:pointer;text-decoration:underline;}
.ae{font-size:13px;color:#c05030;font-weight:700;text-align:center;margin-bottom:10px;display:none;}
.ae.show{display:block;}

/* LOADING SCREEN */
#load{align-items:center;justify-content:center;background:linear-gradient(150deg,#feecd8 0%,#fde8f0 40%,#ece8fc 100%);}
.lt">Loading Nimbus...</div>

/* ONBOARDING SCREEN */
#onboard{align-items:center;justify-content:center;padding:24px;background:linear-gradient(150deg,#feecd8 0%,#fde8f0 40%,#ece8fc 100%);}
.oc{background:rgba(255,252,248,.92);backdrop-filter:blur(16px);border:1.5px solid rgba(240,200,160,.4);border-radius:var(--rxl);padding:30px 26px;max-width:420px;width:100%;box-shadow:0 12px 48px rgba(232,135,74,.12);}
.ot{font-size:25px;font-weight:900;color:var(--td);margin-bottom:6px;line-height:1.2;}
.os{font-size:14px;color:var(--tm);margin-bottom:20px;line-height:1.5;font-weight:600;}
.il{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.ir{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.6);border:1.5px solid rgba(240,200,160,.3);border-radius:var(--rsm);padding:8px 12px;}
.irt{flex:1;font-size:13px;font-weight:700;color:var(--td);}

/* DASHBOARD & SYSTEM APP STYLES */
.ah{padding:52px 22px 14px;background:linear-gradient(180deg,rgba(254,236,216,.85) 0%,transparent 100%);}
.ag{font-size:27px;font-weight:900;color:var(--td);}
.ad{font-size:13px;color:var(--tm);margin-top:2px;font-weight:600;}
.asc{flex:1;overflow-y:auto;padding:0 16px 120px;width:100%;}
.card{background:var(--cb);backdrop-filter:blur(10px);border:1.5px solid var(--cbr);border-radius:var(--rlg);padding:16px 17px;margin-bottom:10px;}
.afc{background:linear-gradient(135deg,rgba(252,213,176,.45),rgba(216,208,248,.35));border:1.5px solid rgba(245,185,140,.28);border-radius:var(--rlg);padding:16px 18px;margin-bottom:10px;text-align:center;}
.afq{font-size:15px;font-weight:700;color:var(--td);line-height:1.5;font-style:italic;}
.afa{font-size:12px;font-weight:700;color:var(--tl);margin-top:6px;}
.secH{font-size:11px;font-weight:800;color:var(--tl);text-transform:uppercase;letter-spacing:.8px;margin:18px 0 8px;}
.cin{background:linear-gradient(135deg,rgba(216,208,248,.6),rgba(252,213,176,.45));border:1.5px solid rgba(186,175,240,.4);border-radius:var(--rlg);padding:16px 18px;margin-bottom:12px;text-align:center;display:none;}
.cin.show{display:block;}
.cnt{font-size:16px;font-weight:900;color:var(--lavd);margin-bottom:6px;}
.cns{font-size:13px;color:var(--tm);font-weight:600;margin-bottom:12px;}

/* TASKS LIST */
.tc{background:var(--cb);border:1.5px solid var(--cbr);border-radius:var(--rmd);padding:13px 15px;margin-bottom:7px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.tc:hover{border-color:var(--orl);}
.tc.dc{background:rgba(88,176,136,.07);border-color:rgba(88,176,136,.25);opacity:.7;}
.tc.dc .tt{text-decoration:line-through;color:var(--tl);}
.tck{width:26px;height:26px;border-radius:8px;border:2px solid rgba(245,185,140,.5);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;}
.tck.chk{background:var(--mint);border-color:var(--mint);}
.tck.chk::after{content:'✓';color:white;font-size:13px;font-weight:900;}
.ti{flex:1;}
.tt{font-size:15px;font-weight:700;color:var(--td);}
.tm2{font-size:12px;color:var(--tl);font-weight:600;margin-top:2px;}
.pb{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.pu{background:rgba(232,135,74,.18);color:#b85020;}
.pm{background:rgba(186,175,240,.25);color:#6858b0;}
.pl2{background:rgba(88,176,136,.15);color:#388060;}
.tsd{width:4px;height:100%;position:absolute;left:0;top:0;border-radius:3px 0 0 3px;}

/* BOTTOM NAVIGATION MENU BAR */
.bn2{position:fixed;bottom:0;left:0;right:0;background:rgba(255,252,248,.95);backdrop-filter:blur(20px);border-top:1px solid rgba(240,200,160,.3);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom, 16px));z-index:100;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:6px 0;transition:all .2s;}
.ni{font-size:22px;}
.nl{font-size:10px;font-weight:700;color:var(--tl);text-transform:uppercase;letter-spacing:.3px;}
.nb.act .nl{color:var(--ord);}
.nb.act .ni{transform:scale(1.1);}

/* TIMER INTERFACE PANELS */
#timer{background:linear-gradient(160deg,#2a1808 0%,#3a1e10 40%,#1a2018 100%);color:white;align-items:center;justify-content:center;padding:40px 24px;width:100%;}
.ttn{font-size:19px;font-weight:800;color:rgba(255,255,255,.9);margin-bottom:5px;text-align:center;}
.tph{font-size:12px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:42px;}
.tcw{position:relative;width:252px;height:252px;margin-bottom:42px;}
.tsvg{width:100%;height:100%;transform:rotate(-90deg);}
.ttr{fill:none;stroke:rgba(255,255,255,.07);stroke-width:12;}
.tpr{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .5s;}
.tpr.break{stroke:url(#breakGradient);}
.tce{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.tdi{font-size:52px;font-weight:900;color:white;line-height:1;letter-spacing:-2px;}
.tsu{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);margin-top:4px;}
.tct{display:flex;gap:16px;align-items:center;margin-bottom: 20px;}
.tbtn{border-radius:50%;border:none;cursor:pointer;font-size:22px;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.tbtn.pp{width:78px;height:78px;font-size:28px;background:var(--orb);color:white;box-shadow:0 0 28px rgba(232,135,74,.38);}
.tbtn.pp:hover{transform:scale(1.05);}
.tbtn.sb{width:60px;height:60px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);}

/* ADAPTIVE BREAK POPUP PROMPT */
.bsg{margin-top:16px;background:rgba(88,176,136,.14);border:1px solid rgba(88,176,136,.35);border-radius:var(--rlg);padding:16px 20px;text-align:center;width:100%;max-width:320px;display:none;}
.bsg.show{display:block;}
.bst{font-size:14px;font-weight:800;color:rgba(255,255,255,.8);margin-bottom:10px;}
.bso{display:flex;flex-direction:column;gap:8px;justify-content:center;width:100%;margin-top:10px;}
.bop{padding:12px 16px;border-radius:var(--rmd);border:1.5px solid rgba(88,176,136,.45);background:rgba(88,176,136,.18);color:white;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .2s;width:100%;text-align:center;}
.bop:hover{background:rgba(8
